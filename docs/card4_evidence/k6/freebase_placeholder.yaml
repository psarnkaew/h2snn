# Placeholder for card 4 K6's parameter table: copy of origin/dry-run e419370 H2S-NN/configs/experiments/freebase_h2snn_v3b.yaml (card 2 D1); not in this branch's configs.
# Card 2 D1 (dry-run): HGB Freebase NC (target book, featureless), v3-B anchored, arm `full`; built as
# dblp_h2snn_v3b.yaml. l_max 4 and r 8 named explicitly (spec v1.18: l_max and r are tuned, no calibrated r; 8 is the lowest of the tuned range {8, 16, 32, 64}; the sweep overrides both). Solver settings are the fixed card values (never tuned).
data:
  dataset_name: freebase
  root: data
  face_sample_k: 50
  wisp_max_length: 4
  wisp_walks_per_anchor: 8
model:
  d: 32
  d_r: 16
  edge_mlp_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  orthogonal_map: fasthpp
  propagation: anchored
  arm: full
  tau_init: 1.0
  solver_tolerance: 0.0001
  solver_warmup_tolerance: 0.001
  solver_warmup_epochs: 10
  solver_max_iterations: 100
ablation:
  coupling: symmetric
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
seed: 42
device: cuda
exp_name: freebase_h2snn_v3b
output_dir: experiments
log_every: 10
checkpoint_metric: macro_f1
checkpoint_mode: max
