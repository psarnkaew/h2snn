model: latgrl
task: node_classification
dataset: acm
source: LatGRL/LatGRL/utils/params.py -> acm_params()
notes: l2_coef -> weight_decay. Tuned on the HAN-preprocessed graphs under their 20/40/60-labels-per-class
  protocol; ACM and IMDB differ from HGB's graphs, so these transfer approximately
  rather than exactly (DBLP is the same graph).
params:
  nb_epochs: 500
  hidden_dim: 128
  embed_dim: 64
  nlayer: 2
  eva_lr: 0.05
  eva_wd: 0.001
  patience: 10
  weight_decay: 0.0001
  lr: 0.0005
  dropout: 0.2
  drop_feat: 0.1
  tau: 1.0
  graph_k: 3
  k_pos: 0
  alpha: 2.0
  probe_epochs: 200
