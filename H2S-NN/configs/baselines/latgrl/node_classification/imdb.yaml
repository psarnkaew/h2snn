model: latgrl
task: node_classification
dataset: imdb
source: LatGRL/LatGRL/utils/params.py -> imdb_params()
notes: l2_coef -> weight_decay. Tuned on the HAN-preprocessed graphs under their 20/40/60-labels-per-class
  protocol; ACM and IMDB differ from HGB's graphs, so these transfer approximately
  rather than exactly (DBLP is the same graph).
params:
  nb_epochs: 1000
  hidden_dim: 128
  embed_dim: 64
  nlayer: 2
  eva_lr: 0.03
  eva_wd: 0.0001
  patience: 10
  weight_decay: 0.0
  lr: 0.001
  dropout: 0.2
  drop_feat: 0.6
  tau: 0.7
  graph_k: 3
  k_pos: 1
  alpha: 1.0
  probe_epochs: 200
