model: latgrl
task: node_classification
dataset: dblp
source: LatGRL/LatGRL/utils/params.py -> dblp_params()
notes: l2_coef -> weight_decay. Tuned on the HAN-preprocessed graphs under their 20/40/60-labels-per-class
  protocol; ACM and IMDB differ from HGB's graphs, so these transfer approximately
  rather than exactly (DBLP is the same graph).
params:
  nb_epochs: 1000
  hidden_dim: 128
  embed_dim: 64
  nlayer: 2
  eva_lr: 0.05
  eva_wd: 0.0001
  patience: 10
  weight_decay: 0.0001
  lr: 0.001
  dropout: 0.1
  drop_feat: 0.1
  tau: 0.4
  graph_k: 10
  k_pos: 2
  alpha: 2.0
  probe_epochs: 200
