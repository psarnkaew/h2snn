model: h2sgnn
task: node_classification
dataset: imdb
source: H2SGNN/config.yaml -> 'IMDB' block (upstream commit as cloned)
notes: wd -> weight_decay. u and epochs/early_stopping come from H2SGNN/main.py argparse
  defaults; the ACM block's unused 'dprate' key is dropped.
params:
  K: 10
  emb_dim: 128
  hidden: 256
  input_drop: 0.05
  dropout: 0.7
  lr: 0.0005
  weight_decay: 0.0005
  temp_lr: 0.01
  temp_wd: 1.0
  temp_list_lr: 0.01
  temp_list_wd: 1.0
  beta_lr: 0.01
  beta_wd: 1.0
  alpha: 0.1
  alpha_list: 0.2
  a: 0.0
  b: -0.25
  u: 0.5
  poly: GPR_GPR
  epochs: 1000
  early_stopping: 100
