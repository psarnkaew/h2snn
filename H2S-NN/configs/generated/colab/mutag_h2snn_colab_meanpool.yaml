data:
  dataset_name: mutag
  root: data
  pooling_type: meanpool
  fold_index: 0
  num_folds: 1
model:
  d: 32
  d_r: 16
  d_h: 64
  edge_mlp_hidden_dim: 128
  edge_init_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  K: 4
  eta_0: 0.05
  eta_1: 0.05
  learnable_eta: true
  use_orthogonal: true
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: mutag_h2snn_colab_meanpool
output_dir: experiments/colab
log_every: 10
checkpoint_metric: macro_f1
checkpoint_mode: max
