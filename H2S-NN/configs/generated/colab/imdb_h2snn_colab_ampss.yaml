data:
  dataset_name: imdb
  root: data
  face_sample_k: 50
discovery:
  enabled: true
  mode: auto
  protocol_version: schema_conditioned_v1
  selector_seed: 42
  materialization_seed: 42
  min_schema_length: 2
  max_schema_length: 4
  max_schema_candidates: 128
  selected_schema_k: 6
  max_instances_per_schema: 8000
  max_instances_per_anchor: 30
  max_total_instances: 48000
  max_total_incidences: 144000
  require_target_start: true
  require_target_end: true
  allow_repeated_node_types: true
  exclude_identity_metapaths: true
  instance_weight_mode: schema_conditioned
  warmup_epochs: 5
  operator_anneal_epochs: 5
model:
  d: 32
  d_r: 16
  d_h: 64
  face_chunk_size: 4096
  edge_mlp_hidden_dim: 128
  edge_init_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  K: 4
  eta_0: 0.05
  eta_1: 0.05
  learnable_eta: true
  use_orthogonal: true
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: imdb_h2snn_colab_ampss
output_dir: experiments/colab
log_every: 10
checkpoint_metric: macro_f1
checkpoint_mode: max
