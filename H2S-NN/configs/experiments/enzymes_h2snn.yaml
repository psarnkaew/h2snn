data:
  dataset_name: enzymes
  root: data
  pooling_type: sheafcov
  # HINPool's protocol (ref/HINPOOL.pdf): stratified 80/10/10 holdout over five
  # seeded runs, 100-epoch early stopping. Selection and reporting are on Macro-F1.
  split_protocol: stratified_holdout
  num_runs: 5
  run_index: 0
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
discovery:
  enabled: true
  mode: auto
  protocol_version: schema_conditioned_v1
  selector_seed: 42
  materialization_seed: 42
  selector_strategy: probe
  min_schema_length: 2
  max_schema_length: 4
  max_schema_candidates: 128
  selected_schema_k: 6
  max_instances_per_schema: 8000
  max_instances_per_anchor: 30
  max_total_instances: 20000
  max_total_incidences: 60000
  require_target_start: false
  require_target_end: false
  allow_repeated_node_types: true
  exclude_identity_metapaths: true
  instance_weight_mode: schema_conditioned
  warmup_epochs: 5
  operator_anneal_epochs: 5
model:
  d: 32
  d_r: 16
  d_h: 64
  edge_mlp_hidden_dim: 128
  edge_init_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  K: 4
  eta_0: 0.05
  eta_1: 0.05
  learnable_eta: true
  use_orthogonal: true
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: enzymes_h2snn
output_dir: experiments
log_every: 10
checkpoint_metric: auroc
checkpoint_mode: max
early_stopping_patience: 100
