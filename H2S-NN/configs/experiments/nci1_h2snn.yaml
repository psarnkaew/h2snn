data:
  dataset_name: nci1
  root: data
  # HINPool's protocol (references/background/HINPOOL.pdf): stratified 80/10/10 holdout over five
  # seeded runs, 100-epoch early stopping. Selection and reporting are on Macro-F1.
  split_protocol: stratified_holdout
  num_runs: 5
  run_index: 0
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
model:
  d: 32
  d_r: 16
  edge_mlp_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  K: 4
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: nci1_h2snn
output_dir: experiments
log_every: 10
checkpoint_metric: auroc
checkpoint_mode: max
early_stopping_patience: 100
