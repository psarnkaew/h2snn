data:
  dataset_name: youtube
  root: data
  target_relation: [user, rel_0, user]
  link_val_ratio: 0.10
  neg_sampling_mode: resample_each_epoch
model:
  d: 4
  d_r: 4
  edge_mlp_hidden_dim: 32
  face_mlp_hidden_dim: 32
  classifier_hidden_dim: 32
  K: 2
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: youtube_h2snn_rel0
output_dir: experiments
log_every: 10
checkpoint_metric: auroc
checkpoint_mode: max
