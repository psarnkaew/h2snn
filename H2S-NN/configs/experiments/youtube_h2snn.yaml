data:
  dataset_name: youtube
  root: data
  target_relation: [user, rel_0, user]
  link_val_ratio: 0.10
  neg_sampling_mode: resample_each_epoch
discovery:
  enabled: true
  mode: auto
  protocol_version: schema_conditioned_v1
  selector_seed: 42
  materialization_seed: 42
  selector_strategy: probe
  selector_max_examples: 4096
  min_schema_length: 2
  max_schema_length: 4
  max_schema_candidates: 128
  selected_schema_k: 6
  max_instances_per_schema: 8000
  max_instances_per_anchor: 30
  max_total_instances: 20000
  max_total_incidences: 60000
  require_target_start: true
  require_target_end: true
  allow_repeated_node_types: true
  exclude_identity_metapaths: true
  instance_weight_mode: schema_conditioned
  warmup_epochs: 5
  operator_anneal_epochs: 5
model:
  d: 4
  d_r: 4
  d_h: 16
  edge_mlp_hidden_dim: 32
  edge_init_hidden_dim: 32
  face_mlp_hidden_dim: 32
  classifier_hidden_dim: 32
  K: 2
  eta_0: 0.05
  eta_1: 0.05
  learnable_eta: true
  use_orthogonal: false
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: youtube_h2snn_rel0
output_dir: experiments
log_every: 10
checkpoint_metric: auroc
checkpoint_mode: max
