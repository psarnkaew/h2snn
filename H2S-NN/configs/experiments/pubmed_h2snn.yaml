data:
  dataset_name: pubmed
  root: data
  target_relation: [disease, rel_2, disease]
  link_val_ratio: 0.10
  neg_sampling_mode: resample_each_epoch
model:
  d: 16
  d_r: 8
  edge_mlp_hidden_dim: 64
  face_mlp_hidden_dim: 64
  classifier_hidden_dim: 64
  K: 3
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: pubmed_h2snn
output_dir: experiments
log_every: 10
checkpoint_metric: auroc
checkpoint_mode: max
