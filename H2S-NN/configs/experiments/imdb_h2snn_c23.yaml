# Card 23 (spec 1.33; author 2026-11-26): the re-tune of IMDB NC with the regularisation pack. A copy of
# imdb_h2snn_v3b.yaml with only data.eval_draws: 8 and checkpoint_smoothing: 5 added (the fixed settings that switch on
# the card-23 search space, scripts/run_h2snn_wandb_tuning.py); pass a new --exp_name for the sweep.
# v3-B (spec v1.11; card Part L U5): IMDB, anchored solve, arm `full`, d = 32, r = 12 (calibrated,
# resolved from 0), l_max = 4. Solver settings are the fixed card values (never tuned). The cost
# smoke (`scripts/v3b_cost_smoke.py`) runs 2 epochs of this configuration; it is not a training run.
data:
  dataset_name: imdb
  root: data
  face_sample_k: 50
  eval_draws: 8
model:
  d: 32
  d_r: 16
  edge_mlp_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  orthogonal_map: fasthpp
  propagation: anchored
  arm: full
  tau_init: 1.0
  solver_tolerance: 0.0001
  solver_warmup_tolerance: 0.001
  solver_warmup_epochs: 10
  solver_max_iterations: 100
ablation:
  coupling: symmetric
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
seed: 42
device: cuda
exp_name: imdb_h2snn_v3b
output_dir: experiments
log_every: 10
checkpoint_metric: macro_f1
checkpoint_mode: max
checkpoint_smoothing: 5
