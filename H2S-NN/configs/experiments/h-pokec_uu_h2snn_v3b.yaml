# Card 2 D4b: the large LP task h-pokec_uu (target user -has_friend-> user, LARGE_LP_TASKS), v3-B anchored, arm `full`, WISP; built as lastfm_h2snn_v3b.yaml (D1). Mini-batch (MB1): LinkEpochLoop + LinkScopes on the LargeLinkBundle message graph. l_max 4 and r 8 named explicitly (spec v1.18: tuned; the sweep overrides both).
# Solver settings are the fixed card values (never tuned).
data:
  dataset_name: h-pokec_uu
  task_type: link_prediction
  root: data
  target_relation: [user, has_friend, user]
  decoder_type: dot
  wisp_max_length: 4
  wisp_walks_per_anchor: 8
model:
  d: 32
  d_r: 16
  edge_mlp_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  orthogonal_map: fasthpp
  propagation: anchored
  arm: full
  tau_init: 1.0
  solver_tolerance: 0.0001
  solver_warmup_tolerance: 0.001
  solver_warmup_epochs: 10
  solver_max_iterations: 100
ablation:
  coupling: symmetric
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
epochs: 500
seed: 0
device: cuda
exp_name: h-pokec_uu_h2snn_v3b
output_dir: experiments
log_every: 1
checkpoint_metric: auroc
checkpoint_mode: max
