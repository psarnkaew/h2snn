data:
  dataset_name: dblp
  root: data
  face_sample_k: 50
model:
  d: 32
  d_r: 16
  edge_mlp_hidden_dim: 128
  face_mlp_hidden_dim: 128
  classifier_hidden_dim: 128
  K: 4
  orthogonal_map: fasthpp
optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip: 1.0
epochs: 200
seed: 42
device: cuda
exp_name: dblp_h2snn
output_dir: experiments
log_every: 10
checkpoint_metric: macro_f1
checkpoint_mode: max
